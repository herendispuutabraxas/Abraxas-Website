<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herendispuut Abraxas</title>
  <style>
    :root { color-scheme: dark; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000;
      color:#fff;
    }

    /* Background image at 50% opacity (without affecting text) */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background: url("ABRAXAS logo DEF.png") center/cover no-repeat;
      opacity:0.5;
      z-index:-1;
    }

    .card{
      max-width: 760px;
      padding: 28px 26px;
      margin: 24px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      line-height: 1.55;
    }

    h1{
      margin: 0 0 10px 0;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: 0.2px;
    }

    p{ margin: 10px 0; font-size: 18px; }

    a{
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .sig{ margin-top: 18px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>We zijn nog aan het bouwen</h1>
    <p>Op dit moment zijn we nog aan het bouwen voor onze website.<br/>
       Je kunt ons benaderen via Instagram.</p>

    <p class="sig">
      Met vriendelijke groet,<br/>
      Herendispuut Abraxas
    </p>
  </main>
</body>
</html>
